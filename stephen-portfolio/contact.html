<p class="eyebrow">LET'S CONNECT</p>
<h1>Contact <span>Me</span></h1>
<p class="intro">Complete this form to practise entering contact information. This demo validates your entries in the browser but does not send messages to a server.</p>

<section class="contact-box">
<form id="contactForm" novalidate>
<label for="name">Full Name</label>
<input id="name" name="name" type="text" placeholder="Enter your full name" required>

<label for="email">Email Address</label>
<input id="email" name="email" type="email" placeholder="example@email.com" required>

<label for="phone">Phone Number</label>
<input id="phone" name="phone" type="tel" placeholder="Digits only, no spaces" required>

<label for="message">Message</label>
<textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>

<button class="btn" type="submit">Validate Form</button>
<p id="formFeedback" role="status" aria-live="polite"></p>
</form>
</section>
